services:
  env-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:13.5"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  financialmcp-postgres:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${FINANCIALMCP_POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "financialmcp.apphost-f5fd0c0310-financialmcp-postgres-data"
        read_only: false
    networks:
      - "aspire"
  financialmcp-api:
    image: "${FINANCIALMCP_API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${FINANCIALMCP_API_PORT}"
      ConnectionStrings__dev-financial-db: "Host=financialmcp-postgres;Port=5432;Username=postgres;Password=${FINANCIALMCP_POSTGRES_PASSWORD};Database=dev-financial-db"
      DEV_FINANCIAL_DB_HOST: "financialmcp-postgres"
      DEV_FINANCIAL_DB_PORT: "5432"
      DEV_FINANCIAL_DB_USERNAME: "postgres"
      DEV_FINANCIAL_DB_PASSWORD: "${FINANCIALMCP_POSTGRES_PASSWORD}"
      DEV_FINANCIAL_DB_URI: "postgresql://postgres:${FINANCIALMCP_POSTGRES_PASSWORD}@financialmcp-postgres:5432/dev-financial-db"
      DEV_FINANCIAL_DB_JDBCCONNECTIONSTRING: "jdbc:postgresql://financialmcp-postgres:5432/dev-financial-db"
      DEV_FINANCIAL_DB_DATABASENAME: "dev-financial-db"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "financialmcp-api"
    ports:
      - "${FINANCIALMCP_API_PORT}"
    depends_on:
      financialmcp-postgres:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  financialmcp.apphost-f5fd0c0310-financialmcp-postgres-data:
    driver: "local"
